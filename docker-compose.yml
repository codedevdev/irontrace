services:
  postgres:
    image: postgres:16-alpine
    container_name: irontrace-postgres
    environment:
      POSTGRES_USER: irontrace
      POSTGRES_PASSWORD: irontrace
      POSTGRES_DB: irontrace
    ports:
      - "5432:5432"
    volumes:
      - irontrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irontrace -d irontrace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  irontrace_pgdata:
